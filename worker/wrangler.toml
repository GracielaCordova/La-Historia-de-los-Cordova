name = "buzon-mama-martina"
main = "aportes.js"
compatibility_date = "2025-01-01"

[vars]
REPOSITORIO = "TU-USUARIO/TU-REPOSITORIO"
ORIGEN_PERMITIDO = "https://TU-USUARIO.github.io"
